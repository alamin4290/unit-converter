<!DOCTYPE html>
<html>
<head>
    <title>Unit converter</title>
    <link rel="stylesheet" href="index.css">
</head>
    <body>
        <div class="container">
            <p id="title">Metric / Imperial Unit conversion</p>  
            <input type="text"  id="input-value">
            <button id="convert-btn">Convert</button>
            <button id="reset-btn">Reset</button>
        </div>
        <div class="length">
            <p id="length-tittle">Length (Meter/Feet)</p>
            <p id="length-result"></p>
        </div>
         <div class="volume">
            <p id="volume-tittle">Volume (Liter/Gallon)</p>
            <p id="volume-result"></p> 
        </div>
         <div class="mass">
            <p id="mass-title">mass (Kilogram/Pounds)</p>
            <p id="mass-result"></p>
        </div>
<script src="index.js"></script>
    </body>
</html>
